{% extends "dashboard/_layout.html" %}
{% block title %}Admin · Shipments{% endblock %}
{% block dashboard_content %}
<div class="card reveal"><div class="card-body">
  <div class="card-head">
    <div class="card-title">All shipments</div>
    <div class="d-flex gap-2">
      <div class="input-icon"><i class="bi bi-search"></i><input type="search" class="form-control form-control-sm" placeholder="Filter…" data-filter="#adminShipments"></div>
      <a class="btn btn-sm btn-primary" href="{{ url_for('shipments.create') }}"><i class="bi bi-plus-lg"></i> New</a>
    </div>
  </div>
  {% with table_id = "adminShipments" %}{% include "shipments/_table.html" %}{% endwith %}
</div></div>
{% endblock %}
